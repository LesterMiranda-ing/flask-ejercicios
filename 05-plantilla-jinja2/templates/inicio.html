<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Eliminamos los márgenes por defecto del navegador */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        /* Estilo del rectángulo en la parte superior */
        .banner-superior {
            background-color: #2c3e50; /* Color de fondo del rectángulo */
            color: #ffffff;            /* Color del texto (blanco) */
            text-align: center;        /* Centra el texto horizontalmente */
            padding: 20px 10px;        /* Espacio interno (alto y ancho del rectángulo) */
            font-size: 1.2rem;         /* Tamaño de la letra */
            font-weight: bold;         /* Texto en negrita */
            border-bottom: 4px solid #3498db; /* Un borde decorativo inferior */
        }
    </style>
</head>
<body>
    <h1>Bienvenido a mi aplicación Flask</h1>
    <div class="banner-superior">¡Bienvenido! {{ usuario }}!</div>
    <div class="content">
        <p>Esta es una página simple usando plantillas Jinja2.</p>
    </div>
</body>
</html>
